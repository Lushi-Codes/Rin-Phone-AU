<div class="alarm-app">
  <div class="alarm-countdown">
    <div class="alarm-countdown-main" id="alarmCountdownText">No alarms set</div>
    <div class="alarm-countdown-sub" id="alarmCountdownDate"></div>
  </div>

  <div class="alarm-toolbar">
    <button class="alarm-icon-btn" title="Add alarm" onclick="openAlarmEditor()">+</button>
    <button class="alarm-icon-btn" title="More">⋮</button>
  </div>

  <div class="alarm-list" id="alarmList">
    <!-- ==================================================================
         Alarms — add more by copying an .alarm-item block.
         data-time is 24-hour "HH:MM". data-days uses single letters from
         S M T W T F S for repeating alarms (e.g. "MTWTF"). For a one-time
         alarm, use data-date instead of data-days (e.g. "Fri, Aug 14").
         data-enabled is "true" or "false". data-label is optional.
         ================================================================== -->
    <div class="alarm-item" data-time="04:00" data-days="MTWTF" data-enabled="true" data-label="The best time there is"></div>
    <div class="alarm-item" data-time="06:30" data-days="MTWTF" data-enabled="true" data-label="Yoga and Meditation"></div>
    <div class="alarm-item" data-time="07:00" data-days="MTWTF" data-enabled="true" data-label="Morning Run"></div><div class="alarm-item" data-time="21:30" data-date="Everyday" data-enabled="true" data-label="Sleep"></div>
  </div>

  <!-- Add-alarm editor — alarms created here live only in this session and
       disappear on refresh (nothing is written to storage). -->
  <div class="alarm-editor-overlay" id="alarmEditorOverlay" style="display:none;" onclick="if(event.target===this) closeAlarmEditor()">
    <div class="alarm-editor-sheet">
      <div class="time-picker">
        <div class="time-wheel" id="hourWheel"></div>
        <div class="time-sep">:</div>
        <div class="time-wheel" id="minuteWheel"></div>
        <div class="ampm-toggle">
          <button type="button" class="ampm-btn active" data-val="AM" onclick="selectAmPm(this)">AM</button>
          <button type="button" class="ampm-btn" data-val="PM" onclick="selectAmPm(this)">PM</button>
        </div>
        <div class="time-wheel-highlight"></div>
      </div>

      <div class="alarm-editor-days" id="alarmEditorDays">
        <span class="editor-day" data-letter="S">S</span>
        <span class="editor-day" data-letter="M">M</span>
        <span class="editor-day" data-letter="T">T</span>
        <span class="editor-day" data-letter="W">W</span>
        <span class="editor-day" data-letter="T">T</span>
        <span class="editor-day" data-letter="F">F</span>
        <span class="editor-day" data-letter="S">S</span>
      </div>

      <input type="text" class="alarm-editor-name" id="alarmEditorName" placeholder="Alarm name" maxlength="40" />

      <div class="alarm-editor-actions">
        <button type="button" class="alarm-editor-cancel" onclick="closeAlarmEditor()">Cancel</button>
        <button type="button" class="alarm-editor-save" onclick="saveNewAlarm()">Save</button>
      </div>
    </div>
  </div>
</div>
