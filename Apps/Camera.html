<style>
  .camera-feed-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #000;
  }
  .camera-mode-label {
    padding: 12px 16px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid #333;
  }
  .camera-feed {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    position: relative;
    overflow: hidden;
  }
  #cameraVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #cameraImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #cameraPlaceholder {
    width: 100%;
    height: 100%;
  }
  .camera-bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: rgba(0,0,0,0.9);
  }
  .camera-thumbnail {
    width: 50px;
    height: 50px;
    background: #333;
    border-radius: 6px;
    border: 2px solid #555;
    cursor: pointer;
  }
  .camera-capture-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid rgba(255,255,255,0.3);
    cursor: pointer;
    flex-shrink: 0;
  }
  .camera-capture-btn:active {
    background: #e0e0e0;
  }
  .camera-flip-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(100,150,200,0.4);
    border: 2px solid rgba(100,150,200,0.8);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .camera-flip-btn:active {
    background: rgba(100,150,200,0.6);
  }

  /* Video Gallery */
  .video-gallery-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
  }
  .video-gallery-overlay.active {
    display: flex;
  }
  .video-gallery-header {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
  }
  .video-gallery-back {
    background: none;
    border: none;
    color: #00a896;
    font-size: 16px;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(0, 168, 150, 0.2);
    border: 1px solid #00a896;
  }
  .video-gallery-back:active {
    background: rgba(0, 168, 150, 0.3);
  }
  .video-gallery-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #galleryVideo {
    width: 100%;
    height: 100%;
    object-fit: scale-down;
  }
  .video-gallery-nav {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .video-gallery-swipe-area {
    flex: 1;
    cursor: pointer;
    pointer-events: all;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: rgba(255, 255, 255, 0.6);
    transition: color 0.2s;
  }
  .video-gallery-swipe-area:hover {
    color: rgba(255, 255, 255, 0.9);
  }
  .video-gallery-swipe-area:active {
    color: rgba(255, 255, 255, 1);
  }

</style>
