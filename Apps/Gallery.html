<style>
.gallery-container {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 16px;
  padding: 16px;
  overflow-y: auto;
}

.gallery-header {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 8px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.album-card {
  position: relative;
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  background: linear-gradient(135deg, #1e2421 0%, #1a1a1a 100%);
  border: 1px solid #333;
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.album-card.hidden {
  display: none;
}

.album-card:active {
  transform: scale(0.98);
}

.album-icon {
  font-size: 36px;
  opacity: 0.8;
}

.album-name {
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  text-align: center;
  padding: 0 8px;
}

.album-count {
  font-size: 12px;
  color: #aaa;
}

.album-photos {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 1px;
  background: #1a1a1a;
  opacity: 0.4;
  pointer-events: none;
}

.album-photo-item {
  background: #2a2a2a;
  border-radius: 0;
}

.album-photo-item.filled {
  background: #333;
}

.gallery-view {
  display: none;
  flex-direction: column;
  height: 100%;
  gap: 0;
}

.gallery-view.active {
  display: flex;
}

.gallery-view-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid #333;
}

.gallery-view-title {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}

.back-btn {
  background: #00a896;
  border: none;
  color: #000;
  font-size: 13px;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 500;
}

.photos-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
  padding: 4px;
  overflow-y: auto;
  flex: 1;
}

.photo-item {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: #1a1a1a;
  border: 1px solid #333;
  cursor: pointer;
}

.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-viewer-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.95);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  box-sizing: border-box;
}

.photo-viewer-modal.active {
  display: flex;
  flex-direction: column;
}

.photo-viewer-container {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  width: 100%;
  max-height: 100%;
}

.photo-viewer-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

.photo-viewer-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0, 0, 0, 0.5);
  border: none;
  color: #fff;
  font-size: 28px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.photo-viewer-close:hover {
  background: rgba(0, 0, 0, 0.8);
}

.photo-viewer-description {
  margin-top: 16px;
  padding: 0 20px 20px 20px;
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  max-width: 100%;
  word-wrap: break-word;
}

.photo-viewer-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.5);
  border: none;
  color: #fff;
  font-size: 36px;
  width: 50px;
  height: 50px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background 0.2s;
  z-index: 10;
}

.photo-viewer-nav:hover {
  background: rgba(0, 0, 0, 0.8);
}

.photo-viewer-nav.prev {
  left: 12px;
}

.photo-viewer-nav.next {
  right: 12px;
}

.photo-viewer-counter {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}
</style>
