<!-- ==================================================================
     Message data stored as JSON for script.js to load.
     Each conversation:
       id       - unique slug (used to open the thread)
       name     - contact name shown in list + thread header
       icon     - avatar initials
       avatarImage - optional image URL for the avatar (leave "" for none)
       snippet  - preview text shown in the message list
       date     - short date label shown in the list (e.g. "Fri")
       unread   - unread badge count (0 = no badge)
       messages - array of {sender, time, text} where sender is "them" or "you";
                  "date" is optional and only needed on the first message of a new day.
     ================================================================== -->

<!-- Message Thread View -->
<div class="conversation-thread" id="conversationThread" style="display: none">
  <div class="thread-header">
    <button class="thread-back" onclick="closeThreadView()">‹</button>
    <div class="thread-title" id="threadTitle">Contact Name</div>
    <div class="thread-menu">⋮</div>
  </div>

  <div class="messages-container" id="messagesContainer"></div>

  <div class="message-input-area">
    <input type="text" class="message-input" id="messageInput" placeholder="iMessage" />
    <button
      class="input-button"
      onclick="
        (function () {
          sendThreadMessage(window.currentThreadId, document.getElementById('messageInput').value);
          document.getElementById('messageInput').value = '';
        })()
      "
    >
      ➤
    </button>
  </div>
</div>
