<style>
/* Dialer layout matching the provided screenshot: three vertical columns with large numbers and small letter labels */
.phone-keypad-wrapper{
  /* padding:12px 18px 24px 18px; */
  color:#fff;
  /* background:#050505; */
  box-sizing:border-box;
  width:100%;
}

.key-display{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  /* padding:6px 10px 18px 10px; */
}
.dial-display{
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  color:#fff;
  font-size:30px;
  text-align:center;
  border:0;
  background:transparent;
  outline:none;
  white-space:nowrap;
  overflow-x:auto;
  -webkit-overflow-scrolling: touch;
  padding:4px 8px;
  max-width:100%;
}

.keypad{
  width:100%;
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-auto-rows: 64px; /* row height */
  gap:18px 8%;
  align-items:center;
  justify-items:center;
  padding-top:8px;
}

.key{
  background:transparent;
  border:0;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0 4px;
}
.key .digit{
  font-size:25px;
  line-height:1;
  font-weight:200;
}
.key .letters{
  font-size:10px;
  color:#9aa;
  margin-top:3px;
}

.call-row{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:18px}
.call-btn{width:50px;height:50px;border-radius:50%;background:#23b14d;border:0;color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.backspace-btn,.clear-btn{width:35px;height:35px;background:transparent;border-radius:50%;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* Left and right action icons near the bottom like the screenshot */
.dial-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 18px}
.dial-actions .left,.dial-actions .right{color:#9aa;font-size:24px}

/* make layout responsive and prevent collapse to single column */
@media (max-width:420px){
  .keypad{grid-auto-rows:64px;gap:14px 6%;}
  .key .digit{font-size:36px}
  .call-btn{width:64px;height:64px;font-size:26px}
  .dial-display{font-size:34px}
}

.phone-keypad-wrapper *{box-sizing:border-box}
</style>

<div class="phone-keypad-wrapper">
  <div class="key-display">
    <input type="text" class="dial-display" placeholder="" readonly autocomplete="off"/>
  </div>

  <div class="keypad" aria-hidden="false">
    <button class="key" data-digit="1">
      <div class="digit">1</div>
      <div class="letters"></div>
    </button>

    <button class="key" data-digit="2">
      <div class="digit">2</div>
      <div class="letters">ABC</div>
    </button>
    <button class="key" data-digit="3">
      <div class="digit">3</div>
      <div class="letters">DEF</div>
    </button>

    <button class="key" data-digit="4">
      <div class="digit">4</div>
      <div class="letters">GHI</div>
    </button>
    <button class="key" data-digit="5">
      <div class="digit">5</div>
      <div class="letters">JKL</div>
    </button>
    <button class="key" data-digit="6">
      <div class="digit">6</div>
      <div class="letters">MNO</div>
    </button>

    <button class="key" data-digit="7">
      <div class="digit">7</div>
      <div class="letters">PQRS</div>
    </button>
    <button class="key" data-digit="8">
      <div class="digit">8</div>
      <div class="letters">TUV</div>
    </button>
    <button class="key" data-digit="9">
      <div class="digit">9</div>
      <div class="letters">WXYZ</div>
    </button>

    <button class="key" data-digit="*">
      <div class="digit">*</div>
      <div class="letters"></div>
    </button>
    <button class="key" data-digit="0">
      <div class="digit">0</div>
      <div class="letters">+</div>
    </button>
    <button class="key" data-digit="#">
      <div class="digit">#</div>
      <div class="letters"></div>
    </button>
  </div>

  <div class="call-row">
    <button type="button" class="clear-btn" title="Clear" aria-label="Clear">✕</button>
    <button type="button" class="call-btn" title="Call" aria-label="Call">📞</button>
    <button type="button" class="backspace-btn" title="Backspace" aria-label="Backspace">⌫</button>
  </div>


</div>
